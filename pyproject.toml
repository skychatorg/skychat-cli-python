[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "skychat-tui"
version         = "0.1.0"
description     = "Terminal client for skych.at"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }

dependencies = [
    "websockets>=12.0",
    "pillow>=12.0",
]

[project.scripts]
skychat = "skychat_tui.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["skychat_tui*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/skychat.1"]
