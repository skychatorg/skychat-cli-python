[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "skychat-tui"
version         = "0.1.2"
description     = "Terminal client for skych.at"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "WTFPL" }

dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
# pip install skychat-tui[images]
# Enables Kitty and Sixel inline image preview.
# libcaca (img2txt) works without Pillow and is auto-detected separately.
images = [
    "pillow>=12.0",
]

[project.scripts]
skychat = "skychat_tui.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["skychat_tui*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/skychat.1"]